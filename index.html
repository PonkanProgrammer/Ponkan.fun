<!-- サーバー参加案内セクション -->
<div class="server-join-container">
  <h2 class="server-title">PONKAN SMP サーバー参加方法</h2>

  <div class="server-grid">
    <!-- Java版カード -->
    <div class="server-card java-card">
      <div class="card-badge">Java Edition (PC)</div>
      <h3>Java版で参加</h3>
      <p class="desc">PCから参加する方</p>
      
      <div class="ip-box">
        <label>サーバーアドレス</label>
        <div class="copy-input-group">
          <input type="text" value="mc.ponkan.fun" id="java-ip" readonly>
          <button onclick="copyToClipboard('java-ip', this)" class="btn-copy">コピー</button>
        </div>
        <span class="note">※ポート番号の入力は不要です</span>
      </div>
    </div>

    <!-- 統合版 (Bedrock / Geyser) カード -->
    <div class="server-card bedrock-card">
      <div class="card-badge">Bedrock Edition (Geyser)</div>
      <h3>統合版で参加</h3>
      <p class="desc">スマホ / iPad / Switch / PS / XBOX / Windows版</p>
      
      <div class="ip-box">
        <label>サーバーアドレス</label>
        <div class="copy-input-group">
          <input type="text" value="bedrock.ponkan.fun" id="bedrock-ip" readonly>
          <button onclick="copyToClipboard('bedrock-ip', this)" class="btn-copy">コピー</button>
        </div>

        <label style="margin-top: 10px;">ポート番号</label>
        <div class="copy-input-group">
          <input type="text" value="54512" id="bedrock-port" readonly>
          <button onclick="copyToClipboard('bedrock-port', this)" class="btn-copy">コピー</button>
        </div>
      </div>
    </div>
  </div>
</div>

<style>
/* スタイル（デザイン） */
.server-join-container {
  max-width: 800px;
  margin: 30px auto;
  padding: 20px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  box-sizing: border-box;
}

.server-title {
  text-align: center;
  font-size: 24px;
  margin-bottom: 25px;
  color: #2c3e50;
}

.server-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

@media (max-width: 650px) {
  .server-grid {
    grid-template-columns: 1fr;
  }
}

.server-card {
  background: #ffffff;
  border-radius: 12px;
  padding: 20px;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
  border: 1px solid #e1e8ed;
  display: flex;
  flex-direction: column;
  position: relative;
}

.card-badge {
  display: inline-block;
  align-self: flex-start;
  padding: 4px 8px;
  font-size: 11px;
  font-weight: bold;
  border-radius: 6px;
  background: #f0f4f8;
  color: #555;
  margin-bottom: 8px;
}

.java-card .card-badge { background: #e8f5e9; color: #2e7d32; }
.bedrock-card .card-badge { background: #e3f2fd; color: #1565c0; }

.server-card h3 {
  margin: 0 0 5px 0;
  font-size: 18px;
  color: #333;
}

.server-card .desc {
  font-size: 13px;
  color: #666;
  margin: 0 0 15px 0;
}

.ip-box {
  margin-top: auto;
}

.ip-box label {
  display: block;
  font-size: 12px;
  font-weight: bold;
  color: #777;
  margin-bottom: 4px;
}

.copy-input-group {
  display: flex;
  gap: 6px;
}

.copy-input-group input {
  flex: 1;
  padding: 8px 12px;
  border: 1px solid #ccc;
  border-radius: 6px;
  font-size: 14px;
  background: #f9f9f9;
  color: #333;
  font-family: monospace;
}

.btn-copy {
  padding: 8px 14px;
  background-color: #2ecc71;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  font-weight: bold;
  transition: background-color 0.2s;
  white-space: nowrap;
}

.btn-copy:hover {
  background-color: #27ae60;
}

.note {
  display: block;
  font-size: 11px;
  color: #888;
  margin-top: 6px;
}
</style>

<script>
// クリップボードコピー機能
function copyToClipboard(elementId, btn) {
  const copyText = document.getElementById(elementId);
  copyText.select();
  copyText.setSelectionRange(0, 99999); // スマホ対応
  navigator.clipboard.writeText(copyText.value).then(() => {
    const originalText = btn.innerText;
    btn.innerText = "コピー済!";
    btn.style.backgroundColor = "#3498db";
    setTimeout(() => {
      btn.innerText = originalText;
      btn.style.backgroundColor = "";
    }, 1500);
  });
}
</script>
