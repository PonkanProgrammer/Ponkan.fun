<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ponkan.fun</title>
<meta name="description" content="Ponkanのサイト。ゲームのID。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍊</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --peel:#FF8A00; --peel-deep:#E56E00; --pith:#FFF3DC; --leaf:#24401C; --leaf-soft:#3E6B2F;
  --display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:var(--body);font-weight:500;background:var(--peel);color:var(--leaf);line-height:1.7;overflow-x:hidden}
a{color:inherit}
:focus-visible{outline:3px solid var(--leaf);outline-offset:4px}

/* hero */
.hero{min-height:100svh;position:relative;display:grid;align-content:end;padding:clamp(20px,5vw,64px);overflow:hidden}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(4.2rem,24vw,22rem);line-height:.82;letter-spacing:-.03em;color:var(--pith);display:flex;position:relative;z-index:2}
.hero h1 span{display:inline-block;transform-origin:50% 100%;animation:drop 1.1s cubic-bezier(.3,.7,.4,1) both;animation-delay:calc(var(--i)*.09s + .1s)}
@keyframes drop{
  0%{transform:translateY(-120vh) scale(.9,1.25)}
  55%{transform:translateY(0) scale(1.18,.78)}
  72%{transform:translateY(-7%) scale(.94,1.07)}
  86%{transform:translateY(0) scale(1.04,.96)}
  100%{transform:none}
}
.lead{position:relative;z-index:2;margin-top:clamp(16px,3vw,32px);font-size:clamp(1rem,1.6vw,1.25rem);font-weight:700;animation:fade .8s 1.4s both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.fruit-wrap{position:absolute;right:clamp(-60px,2vw,40px);top:clamp(30px,8vh,100px);width:clamp(180px,38vw,520px);aspect-ratio:1;z-index:1;transform:translate(var(--px,0),var(--py,0));transition:transform .25s ease-out}
.fruit{width:100%;height:100%;cursor:pointer;animation:roll 1.8s 1.1s cubic-bezier(.2,.8,.2,1) both;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.fruit svg{width:100%;height:100%;overflow:visible;display:block}
@keyframes roll{from{transform:translateX(-130vw) rotate(-900deg)}to{transform:none}}
.fruit.squish svg{animation:squish .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes squish{0%{transform:scale(1)}30%{transform:scale(1.14,.82)}65%{transform:scale(.94,1.08)}100%{transform:scale(1)}}
.drop{position:fixed;width:12px;height:12px;border-radius:50%;background:var(--pith);pointer-events:none;z-index:9}

/* ids */
.ids h2{font-family:var(--display);font-weight:400;font-size:clamp(3rem,10vw,8rem);line-height:1}
.ids{padding:clamp(56px,10vw,140px) clamp(20px,5vw,64px) clamp(72px,12vw,160px);background:var(--pith)}
.ids>p{margin:12px 0 48px;font-size:clamp(1rem,1.8vw,1.2rem)}
.ids ul{list-style:none;padding:0;border-top:3px solid var(--leaf)}
.ids li{border-bottom:3px solid var(--leaf)}
.id{all:unset;box-sizing:border-box;cursor:pointer;display:flex;justify-content:space-between;align-items:baseline;gap:16px;width:100%;padding:clamp(28px,5vw,56px) 12px;position:relative;isolation:isolate;overflow:hidden;transition:padding .3s,color .3s}
.id:focus-visible{outline:3px solid var(--leaf);outline-offset:-3px}
.id::before{content:"";position:absolute;inset:0;background:var(--peel);transform:scaleX(0);transform-origin:left;transition:transform .45s cubic-bezier(.2,.8,.2,1);z-index:-1}
.id:hover::before,.id:focus-visible::before{transform:scaleX(1)}
.id:hover,.id:focus-visible{padding-left:clamp(20px,4vw,48px);padding-right:clamp(20px,4vw,48px)}
.id b{font-size:clamp(1.1rem,2.6vw,1.8rem)}
.id span{font-family:var(--display);font-size:clamp(1.8rem,7.5vw,5rem);line-height:1.2;overflow-wrap:anywhere;text-align:right}

footer{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:28px clamp(20px,5vw,64px);background:var(--pith);color:var(--leaf);font-size:.9rem;border-top:3px solid var(--leaf)}
.quietnav{display:flex;gap:18px}
.quiet{font-size:.7rem;text-decoration:none;opacity:.25;transition:opacity .3s}
.quiet:hover,.quiet:focus-visible{opacity:.9}

.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,24px);background:var(--leaf);color:var(--pith);padding:12px 22px;border-radius:999px;font-weight:700;opacity:0;pointer-events:none;transition:.35s cubic-bezier(.2,.8,.2,1);z-index:10}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:640px){
  .hero{align-content:end}
  .fruit-wrap{right:-10vw;top:6vh;width:70vw}
  .id{flex-direction:column;align-items:flex-start;gap:2px}
  .id span{text-align:left}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<header class="hero">
  <div class="fruit-wrap" id="wrap">
    <div class="fruit" id="fruit" role="button" tabindex="0" aria-label="ぽんかん（押すとつぶれます）">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <defs>
          <radialGradient id="g" cx="35%" cy="30%" r="75%">
            <stop offset="0" stop-color="#FFC15C"/><stop offset=".55" stop-color="#FF8A00"/><stop offset="1" stop-color="#D45A00"/>
          </radialGradient>
          <pattern id="d" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(20)">
            <circle cx="2" cy="2" r="1.1" fill="#9A3F00" opacity=".28"/>
          </pattern>
        </defs>
        <ellipse cx="100" cy="112" rx="86" ry="82" fill="url(#g)"/>
        <ellipse cx="100" cy="112" rx="86" ry="82" fill="url(#d)"/>
        <ellipse cx="68" cy="76" rx="26" ry="14" fill="#fff" opacity=".28" transform="rotate(-35 68 76)"/>
        <path d="M100 32 q-4 -14 2 -22" stroke="#24401C" stroke-width="6" fill="none" stroke-linecap="round"/>
        <path d="M102 34 C124 14 156 18 166 34 C146 48 118 48 102 34Z" fill="#3E6B2F"/>
        <path d="M104 34 C122 30 142 30 160 34" stroke="#24401C" stroke-width="2" fill="none" opacity=".5"/>
      </svg>
    </div>
  </div>

  <h1 aria-label="ponkan">
    <span style="--i:0" aria-hidden="true">p</span><span style="--i:1" aria-hidden="true">o</span><span style="--i:2" aria-hidden="true">n</span><span style="--i:3" aria-hidden="true">k</span><span style="--i:4" aria-hidden="true">a</span><span style="--i:5" aria-hidden="true">n</span>
  </h1>
  <p class="lead">ぽんかんのサイト。ゲームのIDはこちら。</p>
</header>

<main>
  <section class="ids" aria-labelledby="ids-h">
    <h2 id="ids-h">ID</h2>
    <p>押すとコピーできます。</p>
    <ul>
      <li><button class="id" data-copy="Ponkan_rblx"><b>Roblox</b><span>Ponkan_rblx</span></button></li>
      <li><button class="id" data-copy="ponkan.fun"><b>Discord</b><span>ponkan.fun</span></button></li>
      <li><button class="id" data-copy="kan620"><b>Xbox</b><span>kan620</span></button></li>
      <li><button class="id" data-copy="_Ponkan"><b>Minecraft (Java)</b><span>_Ponkan</span></button></li>
    </ul>
  </section>
</main>

<footer><span>&copy; <span id="y">2026</span> ponkan.fun</span><nav class="quietnav" aria-label="サブドメイン"><a class="quiet" href="https://proxy.ponkan.fun">proxy</a><a class="quiet" href="https://yt.ponkan.fun">yt</a></nav></footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.getElementById('y').textContent = new Date().getFullYear();

  // fruit parallax
  var wrap = document.getElementById('wrap');
  if(!reduce){
    addEventListener('pointermove', function(e){
      var x = (e.clientX / innerWidth - .5) * -24, y = (e.clientY / innerHeight - .5) * -24;
      wrap.style.setProperty('--px', x + 'px'); wrap.style.setProperty('--py', y + 'px');
    });
  }

  // fruit squish + juice
  var fruit = document.getElementById('fruit');
  function splash(){
    fruit.classList.remove('squish'); void fruit.offsetWidth; fruit.classList.add('squish');
    if(reduce) return;
    var r = fruit.getBoundingClientRect(), cx = r.left + r.width/2, cy = r.top + r.height/2;
    for(var i=0;i<14;i++){
      var d = document.createElement('i'); d.className = 'drop';
      var s = 6 + Math.random()*10; d.style.width = d.style.height = s + 'px';
      d.style.left = cx + 'px'; d.style.top = cy + 'px';
      document.body.appendChild(d);
      var a = Math.random()*Math.PI*2, dist = 90 + Math.random()*140;
      var dx = Math.cos(a)*dist, dy = Math.sin(a)*dist;
      var anim = d.animate([
        {transform:'translate(0,0) scale(1)',opacity:1},
        {transform:'translate('+dx+'px,'+(dy-40)+'px) scale(1)',opacity:1,offset:.55},
        {transform:'translate('+dx*1.1+'px,'+(dy+120)+'px) scale(.2)',opacity:0}
      ],{duration:900 + Math.random()*400,easing:'cubic-bezier(.2,.7,.4,1)'});
      anim.onfinish = (function(el){return function(){el.remove()}})(d);
    }
  }
  fruit.addEventListener('click', splash);
  fruit.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); splash(); } });

  // copy IDs
  var toast = document.getElementById('toast'), t;
  function show(msg){
    toast.textContent = msg; toast.classList.add('show');
    clearTimeout(t); t = setTimeout(function(){ toast.classList.remove('show'); }, 1600);
  }
  function fallbackCopy(text){
    var ta = document.createElement('textarea'); ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    var ok = false; try{ ok = document.execCommand('copy'); }catch(e){}
    ta.remove(); return ok;
  }
  document.querySelectorAll('.id').forEach(function(b){
    b.addEventListener('click', function(){
      var text = b.dataset.copy;
      var done = function(ok){ show(ok ? text + ' をコピーしました' : 'コピーできませんでした'); };
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(function(){ done(true); }, function(){ done(fallbackCopy(text)); });
      } else { done(fallbackCopy(text)); }
    });
  });
})();
</script>
</body>
</html>
