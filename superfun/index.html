<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discord - 招待の確認中...</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0e1015;
      color: #fff;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* 偽のDiscord招待カード */
    .fake-card {
      background: #181b22;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 36px 28px;
      width: 90%;
      max-width: 440px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      position: relative;
      z-index: 10;
      transition: transform 0.3s ease;
    }

    .server-icon {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #5865f2;
      margin: 0 auto 16px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      box-shadow: 0 8px 24px rgba(88, 101, 242, 0.4);
    }

    .invite-sub {
      font-size: 11px;
      font-weight: 700;
      color: #949ba4;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 6px;
    }

    .server-name {
      font-size: 22px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 8px;
    }

    .online-count {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #23a55a;
      margin-bottom: 24px;
    }

    .dot {
      width: 8px;
      height: 8px;
      background: #23a55a;
      border-radius: 50%;
    }

    .btn-verify {
      width: 100%;
      background: #5865f2;
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(88, 101, 242, 0.4);
      transition: all 0.2s ease;
    }

    .btn-verify:hover {
      background: #4752c4;
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(88, 101, 242, 0.6);
    }

    /* 全画面リックロール演出レイヤー */
    .rick-stage {
      display: none;
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      z-index: 999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .rick-stage iframe {
      width: 100%;
      height: 100%;
      border: none;
      pointer-events: auto;
    }

    .rick-banner {
      position: absolute;
      top: 20px;
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(8px);
      padding: 10px 24px;
      border-radius: 100px;
      font-size: 16px;
      font-weight: 800;
      color: #ffcc00;
      letter-spacing: 0.05em;
      z-index: 1000;
      animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes pop {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .back-link {
      position: absolute;
      bottom: 20px;
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      padding: 8px 18px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      z-index: 1000;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body>

  <!-- 偽のDiscord招待カード（クリックを誘導するトラップ） -->
  <div class="fake-card" id="trap-card">
    <div class="server-icon">🍊</div>
    <div class="invite-sub">PONKAN COMMUNITY に招待されました</div>
    <div class="server-name">PONKAN SECRET VC</div>
    <div class="online-count">
      <span class="dot"></span>
      <span>1,337 人がオンライン</span>
    </div>
    <button class="btn-verify" onclick="launchRickroll()">招待を受ける（参加する）</button>
  </div>

  <!-- リックロール全画面コンテナ -->
  <div class="rick-stage" id="rick-stage">
    <div class="rick-banner">🎉 YOU GOT RICKROLLED! 🍊</div>
    
    <div id="player-container" style="width: 100%; height: 100%;"></div>

    <a href="https://ponkan.fun" class="back-link">← ホームに戻る</a>
  </div>

  <script>
    function launchRickroll() {
      // 偽カードを隠して全画面レイヤーを表示
      document.getElementById('trap-card').style.display = 'none';
      const stage = document.getElementById('rick-stage');
      stage.style.display = 'flex';

      // ユーザー操作の直後なので自動再生 + 音声ONで埋め込み
      const container = document.getElementById('player-container');
      container.innerHTML = `
        <iframe 
          src="https://www.youtube-nocookie.com/embed/dQw4w9WgXcQ?autoplay=1&controls=1&loop=1&playlist=dQw4w9WgXcQ" 
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
          allowfullscreen>
        </iframe>
      `;
    }
  </script>
</body>
</html>
